# Repository-safe example. The deployed file also keeps the instance interface
# identity generated by cloud-init; that MAC-specific value is intentionally omitted.
network:
  version: 2
  ethernets:
    ens5:
      dhcp4: true
      dhcp4-overrides:
        use-dns: false
      dhcp6: false
      nameservers:
        addresses:
          - 10.50.30.10
