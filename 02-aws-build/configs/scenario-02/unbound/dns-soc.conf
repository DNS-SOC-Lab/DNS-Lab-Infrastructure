server:
    interface: 10.50.30.10
    port: 53

    access-control: 10.50.30.20/32 allow
    access-control: 127.0.0.0/8 allow

    module-config: "respip iterator"

    hide-identity: yes
    hide-version: yes
    verbosity: 1

    log-queries: yes
    log-replies: yes
    log-tag-queryreply: yes
    use-syslog: yes

forward-zone:
    name: "."
    forward-addr: 10.50.0.2
