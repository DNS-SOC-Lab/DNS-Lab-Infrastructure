# DNS SOC Lab - Nginx Configuration
#
# Implementation Owner: Musfira
#
# Public hostnames:
#   soclab.abdul4rehman215.tech
#   www.soclab.abdul4rehman215.tech
#
# Document root:
#   /var/www/dns-soc-lab
#
# Purpose:
#   - Serve the DNS SOC Security Lab landing page
#   - Redirect HTTP traffic to HTTPS
#   - Provide TLS for both public hostnames
#   - Generate site-specific access and error logs

server {
    listen 80;
    listen [::]:80;

    server_name soclab.abdul4rehman215.tech www.soclab.abdul4rehman215.tech;

    # Redirect all HTTP traffic to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name soclab.abdul4rehman215.tech www.soclab.abdul4rehman215.tech;

    # Website document root
    root /var/www/dns-soc-lab;
    index index.html;

    # Site-specific logging
    access_log /var/log/nginx/soclab_access.log;
    error_log /var/log/nginx/soclab_error.log;

    # Hide Nginx version information
    server_tokens off;

    # Let's Encrypt certificate
    ssl_certificate /etc/letsencrypt/live/soclab.abdul4rehman215.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/soclab.abdul4rehman215.tech/privkey.pem;

    location / {
        try_files $uri $uri/ =404;
    }

    # Basic security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
