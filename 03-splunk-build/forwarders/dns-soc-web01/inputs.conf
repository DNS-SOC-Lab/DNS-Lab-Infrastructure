# Repository-safe Universal Forwarder input configuration.
# Monitor only the project Nginx logs required for the current lab stage.

[monitor:///var/log/nginx/soclab_access.log]
disabled = false
index = dns_soc_web
sourcetype = dns_soc:nginx:access

[monitor:///var/log/nginx/soclab_error.log]
disabled = false
index = dns_soc_web
sourcetype = dns_soc:nginx:error

# No Linux auth/journal stanza is included until a real source is explicitly
# selected, enabled and validated on dns-soc-web01.
